name: "🚀 Premium Vercel CI/CD Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  # Job 1: Code Quality and Linting Check
  code-analysis:
    name: "🔍 Code Quality & Optimization Check"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧪 Validate Repository Structure
        run: |
          echo "Checking essential files..."
          if [ ! -f index.html ]; then
            echo "❌ Error: index.html missing from root directory!"
            exit 1
          fi
          echo "✅ Repository structure looks perfectly valid."

  # Job 2: Secure Deployment to Vercel
  deploy-vercel:
    name: "🔺 Live Automated Deployment to Vercel"
    needs: code-analysis
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (For Premium Tooling)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 📥 Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy to Vercel Production Live Server
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
