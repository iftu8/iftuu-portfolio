<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TOKYO 2030 | Premium Infinite Visuals. 4K & 8K Zero-Duplicate Downloads.">
    <meta name="theme-color" content="#09090b">
    <meta name="author" content="Iftekhar Ahmed Chowdhury">
    
    <title>TOKYO 2030 | Unlimited Pro Vision</title>
    
    <!-- Resource Hints for Lightning Fast Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://picsum.photos" crossorigin>
    <link rel="preconnect" href="https://fastly.picsum.photos" crossorigin>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with Custom Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        tokyoDark: '#050505',
                        tokyoCard: '#0f0f11',
                        tokyoNeon: '#f0abfc',
                        tokyoCyan: '#22d3ee',
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Pro Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #22d3ee; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f0abfc; }

        /* Animated Dark/Neon Background Overlay */
        body {
            background-color: #050505;
            color: #f8fafc;
        }

        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Perfected Pinterest Style Masonry Layout */
        .masonry-grid {
            column-count: 2;
            column-gap: 1.25rem;
        }
        @media (min-width: 640px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 4; } }
        @media (min-width: 1280px) { .masonry-grid { column-count: 5; } }
        @media (min-width: 1536px) { .masonry-grid { column-count: 6; } }
        
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.25rem;
            transform: translateZ(0); 
            will-change: transform, opacity;
        }

        /* Glassmorphism Header */
        .glass-nav {
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .loading-spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid white; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Image Smooth Loading */
        .img-loaded {
            opacity: 1 !important;
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body class="font-sans antialiased overflow-x-hidden selection:bg-tokyoCyan selection:text-black min-h-screen relative">

    <!-- Ambient Background Effects -->
    <div class="fixed inset-0 z-[-1] bg-grid opacity-50 pointer-events-none"></div>
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-tokyoCyan/20 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-blob z-[-1] pointer-events-none"></div>
    <div class="fixed top-1/4 right-1/4 w-96 h-96 bg-tokyoNeon/20 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-blob animation-delay-2000 z-[-1] pointer-events-none"></div>

    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 w-full glass-nav z-50 px-6 py-4 flex justify-between items-center transition-all duration-300">
        <!-- Logo -->
        <div class="font-heading text-2xl font-black tracking-tighter text-white cursor-pointer flex items-center gap-2 hover:scale-105 transition-transform duration-300">
            TOKYO<span class="text-transparent bg-clip-text bg-gradient-to-r from-tokyoCyan to-tokyoNeon drop-shadow-[0_0_10px_rgba(34,211,238,0.5)]">2030</span>
        </div>

        <!-- Right Side: Socials & AI -->
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-5 border-r border-white/10 pr-6">
                <!-- LinkedIn -->
                <a href="https://bd.linkedin.com/in/iftekhar-ahmed-chowdhury-aa432b416" target="_blank" rel="noopener noreferrer" 
                   class="text-gray-400 hover:text-tokyoCyan hover:drop-shadow-[0_0_8px_rgba(34,211,238,0.8)] transition-all duration-300">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                </a>
                <!-- Facebook -->
                <a href="https://www.facebook.com/iftekhar.ahmmed.chowdhury" target="_blank" rel="noopener noreferrer"
                   class="text-gray-400 hover:text-[#1877f2] hover:drop-shadow-[0_0_8px_rgba(24,119,242,0.8)] transition-all duration-300">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" clip-rule="evenodd"/></svg>
                </a>
            </div>

            <!-- Ask AI Button -->
            <button class="group relative px-6 py-2 rounded-full overflow-hidden bg-tokyoCard border border-white/10 hover:border-tokyoNeon/50 transition-all duration-300">
                <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-tokyoCyan/20 to-tokyoNeon/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                <span class="relative text-sm font-semibold text-white tracking-wide flex items-center gap-2">
                    Ask AI <span class="text-tokyoNeon">✨</span>
                </span>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative w-full pt-40 pb-20 px-4 flex flex-col justify-center items-center text-center z-10">
        <div class="inline-flex items-center gap-2 bg-tokyoCyan/10 text-tokyoCyan px-5 py-2 rounded-full text-xs font-bold mb-8 border border-tokyoCyan/30 uppercase tracking-widest backdrop-blur-md shadow-[0_0_15px_rgba(34,211,238,0.2)] animate-fade-in">
            <span class="w-2 h-2 rounded-full bg-tokyoCyan animate-pulse"></span> Visual Engine Online
        </div>
        
        <h1 class="font-heading text-5xl md:text-7xl lg:text-8xl font-black mb-6 tracking-tight max-w-5xl animate-fade-in" style="animation-delay: 0.1s;">
            Infinite. Unique. <br/>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-tokyoCyan via-white to-tokyoNeon filter drop-shadow-[0_0_25px_rgba(240,171,252,0.4)]">
                Limitless 8K Vision.
            </span>
        </h1>
        
        <p class="text-gray-400 text-lg md:text-xl max-w-2xl mb-8 font-light leading-relaxed animate-fade-in" style="animation-delay: 0.2s;">
            Experience the Tokyo 2030 algorithm. Zero duplicate imagery. Scroll infinitely and download in native 4K & 8K resolution, completely free.
        </p>
    </header>

    <!-- Masonry Gallery -->
    <main class="px-4 sm:px-6 md:px-8 pb-24 max-w-[2400px] mx-auto z-10 relative">
        <div id="tokyo-grid" class="masonry-grid"></div>

        <!-- Infinite Loading Indicator -->
        <div id="loader" class="w-full py-16 flex flex-col justify-center items-center opacity-0 transition-opacity duration-300">
            <div class="relative w-12 h-12">
                <div class="absolute inset-0 rounded-full border-4 border-white/5"></div>
                <div class="absolute inset-0 rounded-full border-4 border-t-tokyoCyan border-r-tokyoNeon border-b-transparent border-l-transparent animate-spin"></div>
            </div>
            <p class="mt-5 text-gray-400 text-xs font-bold tracking-[0.2em] uppercase">Synthesizing Assets...</p>
        </div>
    </main>

    <!-- Premium Image Preview Modal -->
    <div id="image-modal" class="fixed inset-0 bg-tokyoDark/90 z-[9000] hidden flex-col justify-center items-center p-4 md:p-10 backdrop-blur-2xl transition-all duration-300 opacity-0">
        <button onclick="closeModal()" aria-label="Close" class="absolute top-6 right-6 text-gray-400 hover:text-white bg-white/5 hover:bg-white/20 p-3 rounded-full transition-all duration-300 backdrop-blur-md border border-white/10 hover:border-white/30 hover:scale-110">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        
        <div class="relative max-w-7xl w-full flex flex-col items-center transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="relative w-full flex justify-center mb-10">
                <div class="absolute inset-0 bg-gradient-to-r from-tokyoCyan/20 to-tokyoNeon/20 blur-[50px] -z-10 rounded-full"></div>
                <img id="modal-img" src="" alt="High Resolution Asset" class="max-w-full max-h-[70vh] rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] object-contain bg-tokyoCard border border-white/10">
            </div>
            
            <div class="flex flex-wrap justify-center gap-5">
                <button onclick="downloadImage('4K')" class="group relative px-8 py-3.5 bg-tokyoCard text-white border border-tokyoCyan/50 rounded-full overflow-hidden transition-all duration-300 hover:shadow-[0_0_30px_rgba(34,211,238,0.3)] hover:-translate-y-1">
                    <div class="absolute inset-0 w-full h-full bg-tokyoCyan opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
                    <span class="relative font-heading font-bold text-lg flex items-center gap-2">
                        <svg class="w-5 h-5 text-tokyoCyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download 4K
                    </span>
                </button>
                
                <button onclick="downloadImage('8K')" class="group relative px-8 py-3.5 bg-tokyoCard text-white border border-tokyoNeon/50 rounded-full overflow-hidden transition-all duration-300 hover:shadow-[0_0_30px_rgba(240,171,252,0.3)] hover:-translate-y-1">
                    <div class="absolute inset-0 w-full h-full bg-tokyoNeon opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
                    <span class="relative font-heading font-bold text-lg flex items-center gap-2">
                        <svg class="w-5 h-5 text-tokyoNeon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download 8K Ultra
                    </span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('tokyo-grid');
        const loader = document.getElementById('loader');
        let isFetching = false;
        let currentHighResSeed = '';

        // Guaranteed Unique ID Generator
        function generateUniqueSeed() {
            return 'xxxx-8xxx-yxxx-xxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Modal Logic with Smooth Animation
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
        const modalContent = document.getElementById('modal-content');

        function openModal(seed) {
            currentHighResSeed = seed;
            modalImg.src = `https://picsum.photos/seed/${seed}/1920/1080`;
            modal.style.display = 'flex';
            // Trigger reflow for animation
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
            document.body.style.overflow = 'hidden'; // Prevent background scroll
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.style.display = 'none';
                modalImg.src = '';
                document.body.style.overflow = '';
            }, 300);
        }

        // Simulated High-Speed Download Logic
        async function downloadImage(quality) {
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span class="relative font-heading font-bold text-lg flex items-center gap-2 text-white">Synthesizing <span class="loading-spinner"></span></span>`;
            btn.style.pointerEvents = 'none';
            
            let width = quality === '8K' ? 7680 : 3840;
            let height = quality === '8K' ? 4320 : 2160;
            let downloadUrl = `https://picsum.photos/seed/${currentHighResSeed}/${width}/${height}`;
            let fileName = `TOKYO_2030_${quality}_${currentHighResSeed}.jpg`;

            try {
                const response = await fetch(downloadUrl);
                if (!response.ok) throw new Error("Network error");
                
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(blobUrl);
                
                btn.innerHTML = `<span class="relative font-heading font-bold text-lg text-green-400 flex items-center gap-2">✓ Asset Acquired</span>`;
            } catch (error) {
                window.open(downloadUrl, '_blank');
                btn.innerHTML = `<span class="relative font-heading font-bold text-lg flex items-center gap-2">Opened in Tab</span>`;
            } finally {
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.pointerEvents = 'auto';
                }, 3000);
            }
        }

        // Generate Ultra-Fast Image Cards (Batched DOM updates)
        const loadPhotos = (count = 15) => {
            if(isFetching) return;
            isFetching = true;
            loader.style.opacity = '1';
            
            const fragment = document.createDocumentFragment();
            const heights = [400, 500, 600, 700, 450, 550];

            for (let i = 0; i < count; i++) {
                const seed = generateUniqueSeed(); 
                const randomHeight = heights[Math.floor(Math.random() * heights.length)];
                // Using fastly CDN for picsum to load faster
                const displayUrl = `https://fastly.picsum.photos/seed/${seed}/500/${randomHeight}`;

                const card = document.createElement('div');
                card.className = "masonry-item group relative rounded-2xl overflow-hidden cursor-zoom-in bg-tokyoCard border border-white/5 hover:border-tokyoCyan/40 transition-colors duration-500 animate-fade-in shadow-lg";
                card.style.animationFillMode = "both";
                card.style.animationDelay = `${(i * 0.05).toFixed(2)}s`; // Staggered fade in
                card.onclick = () => openModal(seed);

                card.innerHTML = `
                    <!-- Skeleton Loader Background -->
                    <div class="absolute inset-0 bg-gray-900 animate-pulse -z-10"></div> 
                    
                    <img src="${displayUrl}" 
                         loading="lazy" 
                         decoding="async" 
                         alt="Tokyo 2030 Asset" 
                         onload="this.classList.add('img-loaded')"
                         class="w-full h-auto object-cover transform group-hover:scale-110 transition-transform duration-[1.5s] ease-out opacity-0 z-0">
                    
                    <!-- Advanced Hover Overlay -->
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-between p-5 z-10">
                        <div class="flex justify-end transform -translate-y-4 group-hover:translate-y-0 transition-transform duration-300 ease-out">
                            <span class="bg-tokyoDark/80 backdrop-blur-md border border-tokyoNeon/50 text-tokyoNeon text-xs font-bold px-3 py-1.5 rounded-full shadow-[0_0_10px_rgba(240,171,252,0.3)]">
                                8K ULTRA
                            </span>
                        </div>
                        <div class="transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300 ease-out">
                            <p class="text-white font-heading font-semibold truncate text-base drop-shadow-md">ASSET // ${seed.split('-')[0].toUpperCase()}</p>
                            <p class="text-gray-300 text-xs mt-1 font-light tracking-wide">Ready for deployment</p>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            }
            
            // Allow DOM to update before appending to avoid jank
            requestAnimationFrame(() => {
                grid.appendChild(fragment);
                isFetching = false;
                loader.style.opacity = '0';
            });
        };

        // Initial Load
        loadPhotos(18);

        // Optimized Intersection Observer for Infinite Scroll
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isFetching) {
                loadPhotos(12); // Load smaller batches to keep scroll smooth
            }
        }, { root: null, rootMargin: '1000px', threshold: 0.1 }); // Increased margin to load BEFORE user reaches bottom

        observer.observe(loader);
    </script>
</body>
</html>
