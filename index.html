<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TOKYO 2030 | Premium Infinite Visuals. 4K & 8K Zero-Duplicate Downloads.">
    <meta name="theme-color" content="#09090b">
    
    <title>TOKYO 2030 | Unlimited Pro Vision</title>
    
    <!-- Premium Fonts for Futuristic Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        tokyoDark: '#09090b',
                        tokyoNeon: '#f0abfc', /* Neon Pink/Purple vibe */
                        tokyoCyan: '#22d3ee', /* Cyberpunk Cyan */
                        tokyoGlass: 'rgba(9, 9, 11, 0.75)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Smooth Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #22d3ee; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #f0abfc; }

        /* Animated Dark/Neon Background */
        body {
            background-color: #09090b;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(34, 211, 238, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(240, 171, 252, 0.08), transparent 25%);
            color: #f8fafc;
            will-change: background;
        }

        /* Pinterest Style Masonry Layout */
        .masonry-grid {
            column-count: 2;
            column-gap: 1rem;
        }
        @media (min-width: 640px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 4; } }
        @media (min-width: 1280px) { .masonry-grid { column-count: 5; } }
        @media (min-width: 1536px) { .masonry-grid { column-count: 6; } }
        
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1rem;
            transform: translateZ(0); /* Hardware acceleration */
        }

        /* Glassmorphism Header */
        .glass-header {
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .loading-spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid white; border-top-color: transparent;
            border-radius: 50%; animation: spin 1s linear infinite; margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans antialiased overflow-x-hidden selection:bg-tokyoCyan selection:text-black min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 w-full glass-header z-50 px-6 py-4 flex justify-between items-center transition-all duration-300">
        <!-- Logo -->
        <div class="font-heading text-2xl font-black tracking-tighter text-white cursor-pointer flex items-center gap-2">
            TOKYO<span class="text-transparent bg-clip-text bg-gradient-to-r from-tokyoCyan to-tokyoNeon">2030</span>
        </div>

        <!-- Right Side: Socials & AI -->
        <div class="flex items-center gap-6">
            <!-- Social Links (LinkedIn & Facebook) -->
            <div class="flex items-center gap-4 border-r border-white/10 pr-6">
                <!-- LinkedIn -->
                <a href="https://bd.linkedin.com/in/iftekhar-ahmed-chowdhury-aa432b416" target="_blank" rel="noopener noreferrer" 
                   class="text-gray-400 hover:text-[#0077b5] transition-colors duration-300" title="LinkedIn Profile">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                </a>
                <!-- Facebook -->
                <a href="https://www.facebook.com/iftekhar.ahmmed.chowdhury" target="_blank" rel="noopener noreferrer"
                   class="text-gray-400 hover:text-[#1877f2] transition-colors duration-300" title="Facebook Profile">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" clip-rule="evenodd"/>
                    </svg>
                </a>
            </div>

            <!-- Ask AI Button -->
            <button class="bg-white/10 hover:bg-white/20 text-white border border-white/10 px-5 py-2 rounded-full text-sm font-semibold transition-all shadow-[0_0_15px_rgba(34,211,238,0.1)] hover:shadow-[0_0_20px_rgba(240,171,252,0.3)]">
                Ask AI ✨
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative w-full pt-32 pb-16 px-4 flex flex-col justify-center items-center text-center">
        <div class="inline-flex items-center gap-2 bg-tokyoCyan/10 text-tokyoCyan px-4 py-1.5 rounded-full text-xs font-bold mb-6 border border-tokyoCyan/20 uppercase tracking-widest">
            <span class="w-2 h-2 rounded-full bg-tokyoCyan animate-pulse"></span> Network Online
        </div>
        
        <h1 class="font-heading text-5xl md:text-7xl font-black mb-6 tracking-tight max-w-4xl">
            Infinite. Unique. <br/>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-tokyoCyan via-white to-tokyoNeon">Limitless 8K Vision.</span>
        </h1>
        
        <p class="text-gray-400 text-lg md:text-xl max-w-2xl mb-8 font-light leading-relaxed">
            Experience the Tokyo 2030 algorithm. Zero duplicate images. Scroll infinitely and download in native 4K & 8K resolution absolutely free.
        </p>
    </header>

    <!-- Masonry Gallery (Pinterest Style) -->
    <main class="px-4 sm:px-6 md:px-8 pb-20 max-w-[2000px] mx-auto">
        <div id="tokyo-grid" class="masonry-grid"></div>

        <!-- Infinite Loading Indicator -->
        <div id="loader" class="w-full py-12 flex flex-col justify-center items-center">
            <div class="w-10 h-10 border-4 border-white/10 border-t-tokyoNeon rounded-full animate-spin"></div>
            <p class="mt-4 text-gray-500 text-xs font-bold tracking-widest uppercase">Rendering New Assets...</p>
        </div>
    </main>

    <!-- Image Preview Modal -->
    <div id="image-modal" class="fixed inset-0 bg-tokyoDark/95 z-[9000] hidden flex-col justify-center items-center p-4 md:p-10 backdrop-blur-xl transition-all opacity-0">
        <button onclick="closeModal()" aria-label="Close" class="absolute top-6 right-6 text-gray-400 hover:text-white bg-white/5 hover:bg-white/20 p-3 rounded-full transition-all backdrop-blur-md">
            ✕ CLOSE
        </button>
        
        <div class="relative max-w-7xl w-full flex flex-col items-center">
            <img id="modal-img" src="" alt="High Resolution Asset" class="max-w-full max-h-[75vh] rounded-xl shadow-2xl mb-8 object-contain bg-gray-900">
            
            <div class="flex flex-wrap justify-center gap-4">
                <button onclick="downloadImage('4K')" class="bg-tokyoCyan text-black font-heading px-8 py-3 rounded-full hover:bg-white transition-all font-bold shadow-[0_0_20px_rgba(34,211,238,0.4)] flex items-center">
                    Download 4K Free
                </button>
                <button onclick="downloadImage('8K')" class="bg-tokyoNeon text-black font-heading px-8 py-3 rounded-full hover:bg-white transition-all font-bold shadow-[0_0_20px_rgba(240,171,252,0.4)] flex items-center">
                    Download 8K Ultra
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript for Pinterest Style Infinite Scroll & No Duplicates -->
    <script>
        const grid = document.getElementById('tokyo-grid');
        const loader = document.getElementById('loader');
        let totalLoaded = 0;
        let isFetching = false;
        let currentHighResSeed = '';

        // Guaranteed Unique ID Generator to prevent any duplicate images
        function generateUniqueSeed() {
            return 'xxxx-8xxx-yxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Modal Logic
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');

        function openModal(seed) {
            currentHighResSeed = seed;
            // Fetching a very high-res image for preview
            modalImg.src = `https://picsum.photos/seed/${seed}/1920/1080`;
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 10);
        }

        function closeModal() {
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.style.display = 'none';
                modalImg.src = '';
            }, 300);
        }

        // Fake Download Trigger for 4K/8K presentation
        async function downloadImage(quality) {
            const btn = event.currentTarget;
            const originalText = btn.innerText;
            btn.innerHTML = `Synthesizing... <span class="loading-spinner"></span>`;
            btn.style.pointerEvents = 'none';
            
            // Adjust resolution based on user selection
            let width = quality === '8K' ? 7680 : 3840;
            let height = quality === '8K' ? 4320 : 2160;
            let downloadUrl = `https://picsum.photos/seed/${currentHighResSeed}/${width}/${height}`;
            let fileName = `TOKYO_2030_${quality}_${currentHighResSeed}.jpg`;

            try {
                const response = await fetch(downloadUrl);
                if (!response.ok) throw new Error("Network error");
                
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(blobUrl);
                
                btn.innerText = "✓ Downloaded";
            } catch (error) {
                window.open(downloadUrl, '_blank');
                btn.innerText = "Opened in Tab";
            } finally {
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.pointerEvents = 'auto';
                }, 3000);
            }
        }

        // Generate Image Cards (Pinterest Style)
        const loadPhotos = (count = 15) => {
            if(isFetching) return;
            isFetching = true;
            
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < count; i++) {
                totalLoaded++;
                const seed = generateUniqueSeed(); 
                
                // Randomize height to create the Pinterest Masonry effect perfectly
                const heights = [400, 500, 600, 700];
                const randomHeight = heights[Math.floor(Math.random() * heights.length)];
                
                const displayUrl = `https://picsum.photos/seed/${seed}/500/${randomHeight}`;

                const card = document.createElement('div');
                card.className = "masonry-item group relative rounded-2xl overflow-hidden cursor-zoom-in bg-white/5";
                card.onclick = () => openModal(seed);

                card.innerHTML = `
                    <div class="absolute inset-0 bg-gray-800 animate-pulse -z-10"></div> 
                    <img src="${displayUrl}" loading="lazy" decoding="async" alt="Tokyo 2030 Asset" 
                         class="w-full h-auto object-cover transform group-hover:scale-105 transition-transform duration-700 ease-out">
                    
                    <!-- Pinterest-like Hover Overlay -->
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-between p-4">
                        <div class="flex justify-end transform -translate-y-2 group-hover:translate-y-0 transition-transform duration-300">
                            <span class="bg-tokyoNeon text-black text-xs font-bold px-3 py-1.5 rounded-full">Save 8K</span>
                        </div>
                        <div class="transform translate-y-2 group-hover:translate-y-0 transition-transform duration-300">
                            <p class="text-white font-heading font-semibold truncate text-sm">Asset // ${seed.toUpperCase()}</p>
                            <p class="text-gray-300 text-xs mt-0.5">Free for Commercial Use</p>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            }
            
            grid.appendChild(fragment);
            isFetching = false;
        };

        // Initial Load
        loadPhotos(20);

        // Infinite Scroll Observer
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !isFetching) {
                    requestAnimationFrame(() => loadPhotos(10)); 
                }
            });
        }, { root: null, rootMargin: '800px', threshold: 0 });

        observer.observe(loader);
    </script>
</body>
</html>
